name: Android CI Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Lay code tu kho chua
      uses: actions/checkout@v4

    - name: 2. Sửa lỗi định dạng xuống dòng (CRLF to LF)
      run: |
        sed -i 's/\r$//' gradlew

    - name: 3. Thiet lap moi truong Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 4. Cap quyen chay cho Gradle Linux
      run: chmod +x gradlew

    - name: 5. Chay lenh assembleDebug de tao APK
      run: ./gradlew assembleDebug --no-daemon

    - name: 6. Xuat file APK ra ngoai de tai ve
      uses: actions/upload-artifact@v4
      with:
        name: MiniScanner-APK-Thanh-Cong
        path: app/build/outputs/apk/debug/app-debug.apk
