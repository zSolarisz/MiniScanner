name: Android CI Build APK

on:
  workflow_dispatch: # Tạo nút bấm thủ công trên giao diện web cho bạn

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Lay code tu kho chua
      uses: actions/checkout@v4

    - name: 2. Thiet lap moi truong Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 3. Cap quyen chay cho Gradle
      run: chmod +x gradlew || echo "Khong can cap quyen"

    - name: 4. Chay lenh assembleDebug de tao APK
      run: ./gradlew assembleDebug --no-daemon

    - name: 5. Xuat file APK ra ngoai de tai ve
      uses: actions/upload-artifact@v4
      with:
        name: MiniScanner-APK-Thanh-Cong
        path: app/build/outputs/apk/debug/app-debug.apk
